           PAGE DETAILS - PURPLE THEME

        * {

            padding: 0;

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg,
                    #0a0015 0%,
                    #1a0030 25%,
                    #2d0050 50%,
                    #1a0030 75%,
                    #0a0015 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== دکمه بازگشت ===== */
        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: rgba(150, 0, 255, 0.2);
            border: 2px solid rgba(150, 0, 255, 0.4);
            border-radius: 50px;
            color: #d4a1ff;
            text-decoration: none;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(150, 0, 255, 0.2);
            margin-bottom: 30px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            background: rgba(200, 50, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(200, 50, 255, 0.4);
            border-color: rgba(200, 50, 255, 0.6);
        }

        /* ===== کانتینر اصلی ===== */
        .game-detail-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== کارت اصلی بازی ===== */
        .game-detail-card {
            display: flex;
            gap: 40px;
            background: linear-gradient(135deg,
                    rgba(30, 0, 60, 0.95) 0%,
                    rgba(50, 0, 80, 0.9) 50%,
                    rgba(20, 0, 40, 0.95) 100%);
            border-radius: 30px;
            padding: 35px;
            border: 2px solid rgba(150, 0, 255, 0.3);
            box-shadow:
                0 0 50px rgba(150, 0, 255, 0.3),
                0 0 100px rgba(150, 0, 255, 0.15),
                inset 0 0 50px rgba(150, 0, 255, 0.05);
            animation: cardPulse 4s ease-in-out infinite;
            position: relative;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .game-detail-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%,
                    rgba(150, 0, 255, 0.05) 0%,
                    transparent 60%);
            animation: cardShine 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes cardShine {
            0%, 100% { transform: translateX(-30%) rotate(0deg); }
            50% { transform: translateX(30%) rotate(5deg); }
        }

        @keyframes cardPulse {
            0%, 100% {
                box-shadow: 0 0 50px rgba(150, 0, 255, 0.3), 0 0 100px rgba(150, 0, 255, 0.15);
            }
            50% {
                box-shadow: 0 0 70px rgba(180, 0, 255, 0.4), 0 0 120px rgba(150, 0, 255, 0.25);
            }
        }

        /* ===== پوستر بازی ===== */
        .game-poster-wrapper {
            flex: 0 0 320px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 0 30px rgba(150, 0, 255, 0.5),
                0 0 60px rgba(150, 0, 255, 0.3),
                inset 0 0 30px rgba(150, 0, 255, 0.2);
            border: 2px solid rgba(200, 50, 255, 0.4);
            animation: posterFloat 5s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes posterFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .game-poster-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            min-height: 400px;
        }

        /* ===== اطلاعات بازی ===== */
        .game-info-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 1;
            position: relative;
        }

        .game-title-detail {
            font-size: 38px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg,
                    #c084fc 0%,
                    #a855f7 30%,
                    #7c3aed 60%,
                    #a855f7 80%,
                    #c084fc 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 4s ease infinite;
            letter-spacing: 2px;
            text-shadow: none;
            line-height: 1.2;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== تگ‌ها ===== */
        .tags-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag-detail {
            padding: 8px 20px;
            background: rgba(150, 0, 255, 0.15);
            border: 1px solid rgba(200, 50, 255, 0.3);
            border-radius: 50px;
            color: #d4a1ff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Chakra Petch', sans-serif;
            box-shadow: 0 0 15px rgba(150, 0, 255, 0.15);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .tag-detail:hover {
            background: rgba(200, 50, 255, 0.25);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 25px rgba(200, 50, 255, 0.3);
            border-color: rgba(200, 50, 255, 0.6);
        }

        /* ===== توضیحات ===== */
        .game-description-detail {
            color: #c8b0e8;
            font-size: 16px;
            line-height: 1.9;
            text-shadow: 0 0 10px rgba(150, 0, 255, 0.2);
            padding: 15px 20px;
            background: rgba(150, 0, 255, 0.05);
            border-radius: 15px;
            border-right: 3px solid rgba(150, 0, 255, 0.3);
        }

        /* ===== باکس اطلاعات ===== */
        .info-boxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin: 5px 0;
        }

        .info-box {
            background: rgba(150, 0, 255, 0.08);
            border: 1px solid rgba(150, 0, 255, 0.2);
            border-radius: 15px;
            padding: 18px 15px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .info-box:hover {
            background: rgba(150, 0, 255, 0.18);
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 0 30px rgba(150, 0, 255, 0.2);
            border-color: rgba(200, 50, 255, 0.4);
        }

        .info-box-label {
            font-size: 11px;
            color: #a080c0;
            font-family: 'Chakra Petch', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .info-box-value {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(150, 0, 255, 0.4);
        }

        /* ===== بخش دانلود ===== */
        .download-section-detail {
            background: linear-gradient(135deg,
                    rgba(30, 0, 60, 0.9) 0%,
                    rgba(50, 0, 80, 0.85) 50%,
                    rgba(20, 0, 40, 0.9) 100%);

            padding: 35px;
            border: 2px solid rgba(150, 0, 255, 0.25);
            box-shadow: 0 0 40px rgba(150, 0, 255, 0.15);

        }

        .download-title-detail {

            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: #d4a1ff;

            gap: 15px;
        }

        }

        .download-list {

            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

        }

        .download-item {

            align-items: center;
            gap: 18px;
            padding: 20px 25px;

            text-decoration: none;

            left: -100%;

            font-weight: 700;

            border-radius: 50px;
            padding: 4px 15px;
            font-size: 11px;
            color: #ffd0a0;
            font-weight: 600;
            font-family: 'Chakra Petch', sans-serif;
        }

                max-width: 100%;

            .game-title-detail {
                font-size: 30px;
            }

            .game-description-detail {

            }

            .info-boxes {
                grid-template-columns: repeat(2, 1fr);

            .download-list {
                grid-template-columns: 1fr;
            }
        }

            body {
                padding: 10px;
            }

                padding: 18px;
                border-radius: 20px;
            }

            .game-poster-wrapper {
                width: 200px;
            }

            .game-title-detail {

            }

            .info-boxes {

                gap: 10px;
            }

            .info-box {
                padding: 12px 10px;
            }

            .info-box-value {
                font-size: 16px;
            }

            .download-section-detail {
                padding: 20px;
                border-radius: 20px;
            }

            .download-item {
                padding: 15px 18px;
                flex-wrap: wrap;
                justify-content: center;
                text-align: center;
            }

            .download-title-detail {
                font-size: 20px;
                justify-content: center;
            }

                font-size: 12px;
                padding: 10px 20px;
            }
        }
    </style>

const params = new URLSearchParams(window.location.search);
const gameId = params.get('id');
const game = games[gameId];

if (!game) {
    window.location.href = 'index.html';
} else {
    // پوستر
    document.getElementById('gamePoster').src = game.poster;

    // عنوان
    document.getElementById('gameTitle').textContent = game.title;

    // تگ‌ها
    document.getElementById('gameTags').innerHTML = game.tags.map(t =>
        `<span class="tag-detail">${t}</span>`
    ).join('');

    // توضیحات
    document.getElementById('gameDescription').textContent = game.desc;

    // باکس‌های اطلاعات
    document.getElementById('gameDetails').innerHTML = `
        <div class="info-box">
            <div class="info-box-label">⭐ امتیاز</div>
            <div class="info-box-value">${game.rating}</div>
        </div>
        <div class="info-box">
            <div class="info-box-label">📅 انتشار</div>
            <div class="info-box-value">${game.release}</div>
        </div>
        <div class="info-box">
            <div class="info-box-label">💾 حجم</div>
            <div class="info-box-value">${game.size}</div>
        </div>
        <div class="info-box">
            <div class="info-box-label">⬇ دانلودها</div>
            <div class="info-box-value">${game.downloads}</div>
        </div>
    `;

    // لینک‌های دانلود
    document.getElementById('downloadLinks').innerHTML = game.links.map((link, index) => `
        <a href="${link.url}" class="download-item" target="_blank" rel="noopener noreferrer">
            <span class="download-icon-detail">${link.icon}</span>
            <div class="download-info-detail">
                <div class="download-name-detail">${link.name}</div>
                <div class="download-size-detail">${link.size}</div>
            </div>
            <span class="download-badge">دانلود</span>
        </a>
    `).join('');
}
